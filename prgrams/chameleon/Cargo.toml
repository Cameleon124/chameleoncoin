[package]
name = "chameleon"
version = "0.1.0"
description = "Chameleon Coin — burn 0.1% of supply to rename the token and change its image"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "chameleon"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.30.1", features = ["metadata"] }
